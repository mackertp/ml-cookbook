[tool.poetry]
name = "ml-cookbook"
version = "0.1.0"
description = "Research References"
authors = ["Preston Mackert"]
license = "MIT"
readme = "ReadMe.md"
package-mode = false

# install dependencies, then explore the notebooks with:
# poetry install
# poetry jupyter-lab
[tool.poetry.dependencies]
python = "^3.12"
jupyterlab = ">=3.5.2,<5.0.0"
tensorflow = "^2.11.0"
numpy = "^2.0.0"
pandas = "^2.2.0"
ipykernel = "^6.19.4"
matplotlib = "^3.6.2"
seaborn = "^0.13.2"
scikit-learn = "^1.2.0"
scipy = "^1.18.0"
psycopg2-binary = "^2.9.5"
sqlalchemy = "^2.0.0"
chempy = "^0.10.1"
periodictable = "^2.1.0"
pytest = "^9.0.3"
rdkit = "^2026.3.4"
ibm-watson = "^11.2.0"
openpyxl = "^3.1.5"
openai = "^2.49.0"
google-genai = "^2.14.0"
boto3 = "^1.39.8"
dotenv = "^0.9.9"
yt-dlp = "^2026.7.4"
azure-mgmt-resource = "^26.0.0"
azure-identity = "^1.23.1"
torch = "^2.7.1"
transformers = "^5.3.0"
ipywidgets = "^8.1.7"
qiskit-ibm-runtime = "^0.48.0"
qiskit-aer = "^0.17.1"
pylatexenc = "^2.10"
qiskit = "^2.1.1"
simple-salesforce = "^1.12.9"
python-dotenv = "^1.2.2"
flask = "^3.1.3"
pydantic = {version = "2.14.0a1", allow-prereleases = true}


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
